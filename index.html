<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Разбей Глючный Телефон Онлайн</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:radial-gradient(ellipse at 50% 0%,#141a26 0%,#07090e 70%);
    color:#dbe7ff;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    user-select:none;
  }
  #app{display:flex;flex-direction:column;height:100dvh;height:100vh}

  /* ---------- HUD ---------- */
  #hud{
    display:flex;justify-content:space-around;align-items:center;
    gap:8px;padding:10px 12px 8px;flex-shrink:0;
    background:linear-gradient(to bottom,rgba(20,26,38,.95),transparent);
    z-index:20;
  }
  .hud-item{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
  .hud-item .label{font-size:9px;letter-spacing:1.5px;color:#5d6d8a;font-weight:700}
  .hud-item .val{
    font-size:clamp(15px,4vw,20px);font-weight:800;
    font-variant-numeric:tabular-nums;
    color:#7ef9ff;text-shadow:0 0 12px rgba(126,249,255,.55);
    white-space:nowrap;
  }
  .hud-item:nth-child(2) .val{color:#ff9de2;text-shadow:0 0 12px rgba(255,157,226,.5)}
  .hud-item:nth-child(3) .val{color:#ffd93d;text-shadow:0 0 12px rgba(255,217,61,.5)}

  /* ---------- STAGE ---------- */
  #stage{
    position:relative;flex:1;min-height:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;
  }
  #fx{position:absolute;inset:0;pointer-events:none;z-index:10}

  #hpwrap{display:flex;flex-direction:column;align-items:center;gap:4px;z-index:5}
  #hpbar{
    width:min(260px,64vw);height:12px;border-radius:8px;
    background:#10141d;border:1px solid #263043;overflow:hidden;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.8);
  }
  #hpfill{
    height:100%;width:100%;border-radius:8px;
    background:linear-gradient(90deg,#ff3d6e,#ff8a3d,#ffd93d);
    transition:width .08s linear;
    box-shadow:0 0 14px rgba(255,90,120,.7);
  }
  #hptext{font-size:11px;font-weight:700;color:#8ea3c4;font-variant-numeric:tabular-nums;letter-spacing:.5px}

  #scaler{position:relative;z-index:5}
  #shaker{transform-origin:0 0}

  /* ---------- PHONE ---------- */
  #phone{
    position:relative;width:220px;height:440px;border-radius:34px;
    background:linear-gradient(155deg,#424a5c 0%,#1d2129 38%,#0d0f15 100%);
    box-shadow:
      0 0 0 2px #4d5568,
      0 0 0 4px #1a1e28,
      0 22px 45px rgba(0,0,0,.75),
      inset 0 1px 1px rgba(255,255,255,.18);
    cursor:pointer;
    will-change:transform,opacity;
  }
  #phone:active{}

  .screen{
    position:absolute;inset:11px;border-radius:25px;overflow:hidden;
    background:radial-gradient(circle at 50% 38%,#0e3b40 0%,#061a25 55%,#030a12 100%);
    box-shadow:inset 0 0 45px rgba(0,255,220,.10), inset 0 0 0 1px rgba(120,220,255,.14);
    transition:filter .12s;
  }
  /* scanlines */
  .screen::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(
      to bottom, rgba(255,255,255,.045) 0 1px, transparent 1px 3px);
    mix-blend-mode:overlay;
  }
  /* красная вспышка-глюк */
  .screen::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
    background:linear-gradient(transparent 0%,rgba(255,0,110,.20) 45%,transparent 55%,rgba(0,255,240,.15) 70%,transparent 100%);
    animation:screenGlitch 2.4s infinite steps(1);
    opacity:.75;
  }
  @keyframes screenGlitch{
    0%,88%,100%{transform:translateX(0);opacity:.6}
    89%{transform:translateX(-9px);opacity:1}
    91%{transform:translateX(7px)}
    93%{transform:translateX(-3px);opacity:.2}
    95%{transform:translateX(5px);opacity:.9}
  }

  .notch{
    position:absolute;top:11px;left:50%;transform:translateX(-50%);
    width:74px;height:17px;background:#05070b;border-radius:0 0 12px 12px;z-index:6;
    box-shadow:inset 0 -2px 4px rgba(0,0,0,.9);
  }
  .notch::after{
    content:"";position:absolute;right:11px;top:5px;width:6px;height:6px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#2a5a8a,#061019);
    box-shadow:0 0 5px rgba(80,180,255,.7);
  }

  .ui{position:absolute;inset:0;padding:30px 14px 14px;z-index:2;display:flex;flex-direction:column;gap:8px}
  .statusbar{
    display:flex;justify-content:space-between;font-size:9px;font-weight:700;
    color:#63d8e8;letter-spacing:.5px;opacity:.85;
  }
  .big-warn{
    margin-top:16px;text-align:center;font-size:34px;line-height:1;
    animation:warnPulse .8s infinite alternate;
    filter:drop-shadow(0 0 12px rgba(255,60,90,.8));
  }
  @keyframes warnPulse{from{transform:scale(1);opacity:.75}to{transform:scale(1.15);opacity:1}}
  .err{
    text-align:center;font-size:11px;font-weight:800;letter-spacing:1px;
    color:#ff5c86;text-shadow:0 0 10px rgba(255,60,110,.85);
    animation:txtGlitch 1.6s infinite steps(1);
  }
  .err:nth-of-type(2){color:#7ef9ff;text-shadow:0 0 10px rgba(126,249,255,.8);font-size:9px;animation-delay:.4s}
  @keyframes txtGlitch{
    0%,90%,100%{transform:translate(0);opacity:1}
    91%{transform:translate(-3px,1px);opacity:.4}
    93%{transform:translate(3px,-1px);opacity:1}
    95%{transform:translate(-1px,0);opacity:.6}
  }
  .bar{
    margin-top:auto;height:7px;border-radius:4px;background:#0a1a22;
    border:1px solid rgba(126,249,255,.25);overflow:hidden;
  }
  .bar-fill{
    height:100%;width:87%;border-radius:4px;
    background:linear-gradient(90deg,#7ef9ff,#ff5c86);
    animation:barJitter 1.3s infinite steps(1);
  }
  @keyframes barJitter{
    0%,100%{width:87%}50%{width:93%}75%{width:81%}
  }
  .loading{
    text-align:center;font-size:9px;color:#5fd0e0;letter-spacing:1.5px;
    animation:blink 1s infinite steps(1);
  }
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.25}}

  .glitch-bar{
    position:absolute;left:-20%;width:140%;height:4px;z-index:4;
    mix-blend-mode:screen;pointer-events:none;
  }

  .dmg-overlay{
    position:absolute;inset:0;border-radius:34px;pointer-events:none;z-index:7;
    background:radial-gradient(circle at 50% 50%,transparent 25%,rgba(255,0,60,.75) 100%);
    opacity:0;transition:opacity .25s;
  }

  /* ---------- SHOP ---------- */
  #shop{
    display:flex;gap:8px;padding:8px 12px 12px;flex-shrink:0;
    overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;
    background:linear-gradient(to top,#0a0c12 40%,transparent);
    z-index:20;
  }
  #shop::-webkit-scrollbar{height:5px}
  #shop::-webkit-scrollbar-thumb{background:#26324a;border-radius:4px}

  .upg{
    flex:0 0 auto;width:124px;padding:8px 9px;
    background:#141a26;border:1px solid #26304a;border-radius:13px;
    color:#c8d8f5;text-align:left;cursor:pointer;font-family:inherit;
    transition:transform .1s,border-color .15s,background .15s,box-shadow .15s;
    display:flex;flex-direction:column;gap:3px;
  }
  .upg:hover:not(:disabled){background:#1a2333;border-color:#3f6c8f;transform:translateY(-2px)}
  .upg:active:not(:disabled){transform:translateY(0) scale(.97)}
  .upg.can{border-color:#4de1ff;box-shadow:0 0 14px rgba(77,225,255,.22)}
  .upg:disabled{opacity:.4;cursor:not-allowed}
  .upg-top{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:#e6f1ff}
  .upg-top .lvl{margin-left:auto;font-size:9px;color:#5d7characters}
  .upg-lvl{margin-left:auto;font-size:9px;color:#5d6d8a;font-weight:700}
  .upg-eff{font-size:10px;color:#7ef9ff;font-weight:700}
  .upg-cost{font-size:11px;font-weight:800;color:#ffd93d;font-variant-numeric:tabular-nums}
  .upg-cost.no{color:#ff5c86}

  #toast{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.7);
    font-size:clamp(16px,5vw,26px);font-weight:900;letter-spacing:1px;
    color:#fff;text-shadow:0 0 20px #ff2d6f,0 0 40px #ff2d6f;
    pointer-events:none;opacity:0;z-index:99;text-align:center;padding:0 20px;
  }
  #toast.show{animation:toastPop 1.5s ease-out forwards}
  @keyframes toastPop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
    15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
    30%{transform:translate(-50%,-50%) scale(1)}
    75%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-90%) scale(1)}
  }
</style>
</head>
<body>
<div id="app">

  <header id="hud">
    <div class="hud-item"><span class="label">ОСКОЛКИ</span><span class="val" id="uiShards">0</span></div>
    <div class="hud-item"><span class="label">УРОВЕНЬ</span><span class="val" id="uiLevel">1</span></div>
    <div class="hud-item"><span class="label">УРОН</span><span class="val" id="uiDmg">1</span></div>
  </header>

  <div id="stage">
    <h1>Разбей Глючный Телефон Онлайн</h1>
   <div id="hpwrap">
      <div id="hpbar"><div id="hpfill"></div></div>
      <div id="hptext">40 / 40</div>
    </div>

    <div id="scaler">
      <div id="shaker">
        <div id="phone">
          <div class="screen" id="screen">
            <div class="ui">
              <div class="statusbar"><span>23:56</span><span>▓▓░ 4%</span></div>
              <div class="big-warn">⚠️</div>
             <div class="err">СИСТЕМА СБОЙ</div>
              <div class="err">ошибка 0x00000DEAD</div>
             <div class="err">ANDROID POCO REDMI ULTRA GALAXY</div>
              <div class="bar"><div class="bar-fill"></div></div>
              <div class="loading">ЗАГРУЗКА... 99%</div>
            </div>
          </div>
          <div class="notch"></div>
          <div class="dmg-overlay" id="dmgOverlay"></div>
        </div>
      </div>
    </div>

    <canvas id="fx"></canvas>
  </div>

  <footer id="shop"></footer>
</div>

<div id="toast"></div>

<script>
(() => {
"use strict";

/* ================= DOM ================= */
const stage      = document.getElementById('stage');
const canvas     = document.getElementById('fx');
const ctx        = canvas.getContext('2d');
const scaler     = document.getElementById('scaler');
const shaker     = document.getElementById('shaker');
const phoneEl    = document.getElementById('phone');
const screenEl   = document.getElementById('screen');
const dmgOverlay = document.getElementById('dmgOverlay');
const shopEl     = document.getElementById('shop');
const hpFill     = document.getElementById('hpfill');
const hpText     = document.getElementById('hptext');
const uiShards   = document.getElementById('uiShards');
const uiLevel    = document.getElementById('uiLevel');
const uiDmg      = document.getElementById('uiDmg');
const toastEl    = document.getElementById('toast');

/* ================= STATE ================= */
const PHONE_W = 220, PHONE_H = 440;

const state = {
  shards: 0,
  level: 1,
  hp: 40,
  maxHp: 40,
  up: { click: 0, auto: 0, crit: 0, critMul: 0 },
  cracks: [],
  dead: false,
};

const UPGRADES = [
  { id:'click',    icon:'👊', name:'Кулак',    base:12,  mult:1.32 },
  { id:'auto',     icon:'🦠', name:'Вирус',    base:50,  mult:1.40 },
  { id:'crit',     icon:'⚡', name:'Крит',     base:80,  mult:1.55, maxLvl:30 },
  { id:'critMul',  icon:'💥', name:'Множитель',base:160, mult:1.65 },
];

/* ================= HELPERS ================= */
function fmt(n){
  n = Math.floor(n);
  if (n < 1000) return String(n);
  const u = ['K','M','B','T','Qa','Qi','Sx'];
  let i = -1;
  while (n >= 1000 && i < u.length - 1){ n /= 1000; i++; }
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : n.toFixed(0)) + u[i];
}
const rand  = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;

/* ================= DERIVED STATS ================= */
function stats(){
  return {
    dmg:    1 + state.up.click * 1.5,
    critC:  Math.min(0.65, 0.05 + state.up.crit * 0.02),
    critM:  2 + state.up.critMul * 0.5,
    dps:    state.up.auto * 1.5,
  };
}
function upCost(u){
  return Math.ceil(u.base * Math.pow(u.mult, state.up[u.id]));
}

/* ================= AUDIO ================= */
let actx = null;
function ensureAudio(){
  if (!actx){
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function noiseBurst(dur, freq, q, vol){
  if (!actx) return;
  const t = actx.currentTime;
  const len = Math.max(1, Math.floor(actx.sampleRate * dur));
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.2);
  const src = actx.createBufferSource(); src.buffer = buf;
  const bp = actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=freq; bp.Q.value=q;
  const g = actx.createGain(); g.gain.value = vol;
  src.connect(bp); bp.connect(g); g.connect(actx.destination);
  src.start(t);
}
function playHit(crit){
  if (!actx) return;
  noiseBurst(crit ? 0.11 : 0.055, crit ? 2300 : 1150, 0.9, crit ? 0.34 : 0.17);
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(crit ? 170 : 115, t);
  o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
  g.gain.setValueAtTime(crit ? 0.22 : 0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + 0.15);
}
function playBreak(){
  if (!actx) return;
  noiseBurst(0.55, 900, 0.6, 0.42);
  noiseBurst(0.35, 2600, 1.2, 0.28);
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(320, t);
  o.frequency.exponentialRampToValueAtTime(35, t + 0.5);
  g.gain.setValueAtTime(0.18, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + 0.6);
}
function vibrate(ms){ if (navigator.vibrate) navigator.vibrate(ms); }

/* ================= PARTICLES ================= */
const particles = [];
const floaters  = [];

function spawnBurst(cx, cy, crit, count){
  const n = count || (crit ? 24 : 13);
  for (let i = 0; i < n; i++){
    const a  = Math.random() * Math.PI * 2;
    const sp = (crit ? 260 : 150) + Math.random() * 280;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 70,
      life: rand(0.45, 1.05),
      maxLife: 1,
      size: rand(2, crit ? 8 : 5),
      rot: Math.random() * 6.283,
      vr: rand(-14, 14),
      grav: 950,
      drag: 0.965,
      kind: Math.random() < 0.38 ? 'shard' : 'spark',
      color: crit
        ? (Math.random() < 0.55 ? '#ffd93d' : '#fff3a0')
        : (Math.random() < 0.5 ? '#7ef9ff' : '#ff5ca8'),
    });
  }
}

function spawnExplosion(){
  const r = phoneEl.getBoundingClientRect();
  const cr = canvas.getBoundingClientRect();
  for (let i = 0; i < 110; i++){
    const x = cr.left + (r.left - cr.left) + Math.random() * r.width;
    const y = cr.top  + (r.top  - cr.top ) + Math.random() * r.height;
    const a = Math.random() * Math.PI * 2;
    const sp = rand(120, 780);
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 180,
      life: rand(0.7, 1.6),
      maxLife: 1,
      size: rand(2, 10),
      rot: Math.random() * 6.283,
      vr: rand(-20, 20),
      grav: 1100,
      drag: 0.972,
      kind: Math.random() < 0.5 ? 'shard' : 'spark',
      color: ['#7ef9ff','#ff5ca8','#ffd93d','#ffffff','#ff3d6e'][(Math.random()*5)|0],
    });
  }
}

function addFloater(x, y, text, color, size){
  floaters.push({
    x, y, vy: -95, vx: rand(-22, 22),
    life: 0.9, maxLife: 0.9,
    text, color: color || '#fff', size: size || 20,
  });
}

/* ================= CRACKS ================= */
function addCrack(nx, ny){
  const branches = 4 + ((Math.random() * 4) | 0);
  for (let b = 0; b < branches; b++){
    let x = nx, y = ny;
    let ang = Math.random() * Math.PI * 2;
    const segs = 3 + ((Math.random() * 4) | 0);
    for (let s = 0; s < segs; s++){
      const len = rand(0.028, 0.075);
      ang += rand(-0.55, 0.55);
      const x2 = clamp(x + Math.cos(ang) * len, -0.02, 1.02);
      const y2 = clamp(y + Math.sin(ang) * len, -0.02, 1.02);
      state.cracks.push({
        x1: x, y1: y, x2, y2,
        w: rand(0.8, 2.2),
        a: rand(0.45, 0.9),
      });
      x = x2; y = y2;
    }
  }
  if (state.cracks.length > 1100) state.cracks.splice(0, state.cracks.length - 1100);
}

/* ================= GAME ACTIONS ================= */
function doHit(clientX, clientY){
  if (state.dead) return;
  ensureAudio();

  const s = stats();
  const crit = Math.random() < s.critC;
  let dmg = Math.max(1, Math.round(s.dmg * (crit ? s.critM : 1)));

  state.hp -= dmg;
  state.shards += crit ? 2 : 1;

  const r  = phoneEl.getBoundingClientRect();
  const cr = canvas.getBoundingClientRect();
  const cx = clientX - cr.left;
  const cy = clientY - cr.top;
  const nx = clamp((clientX - r.left) / r.width,  0.02, 0.98);
  const ny = clamp((clientY - r.top ) / r.height, 0.02, 0.98);

  addCrack(nx, ny);
  spawnBurst(cx, cy, crit);
  addFloater(cx, cy - 12, (crit ? '⚡' : '') + fmt(dmg), crit ? '#ffd93d' : '#ffffff', crit ? 26 : 19);
  shakePhone(crit);
  playHit(crit);
  vibrate(crit ? 22 : 10);

  // глюк экрана
  screenEl.style.transform = `translate(${rand(-4,4)}px,${rand(-3,3)}px)`;
  screenEl.style.filter = `hue-rotate(${rand(-40,40)}deg) saturate(${rand(1,2.4)})`;
  setTimeout(() => { screenEl.style.transform = ''; screenEl.style.filter = ''; }, 90);

  if (state.hp <= 0) destroyPhone();
  updateHUD();
}

function shakePhone(crit){
  const amp = crit ? 9 : 4.5;
  phoneEl.animate([
    { transform: 'translate(0,0) rotate(0deg)' },
    { transform: `translate(${rand(-amp,amp)}px,${rand(-amp*0.7,amp*0.7)}px) rotate(${rand(-1.6,1.6)}deg)` },
    { transform: 'translate(0,0) rotate(0deg)' },
  ], { duration: crit ? 210 : 130, easing: 'ease-out' });
}

function destroyPhone(){
  if (state.dead) return;
  state.dead = true;
  state.hp = 0;

  const reward = Math.round(state.maxHp * 0.5) + state.level * 5;
  state.shards += reward;

  spawnExplosion();
  playBreak();
  vibrate([40, 40, 90]);

  const r  = phoneEl.getBoundingClientRect();
  const cr = canvas.getBoundingClientRect();
  showToast('ТЕЛЕФОН УНИЧТОЖЕН!\n+' + fmt(reward) + ' 💎');

  addFloater((r.left - cr.left) + r.width/2, (r.top - cr.top) + r.height/2,
             '+' + fmt(reward), '#ffd93d', 34);

  const a = phoneEl.animate([
    { transform: 'translate(0,0) scale(1) rotate(0deg)',        opacity: 1, filter: 'brightness(1)' },
    { transform: 'translate(0,0) scale(1.14) rotate(-7deg)',    opacity: 1, filter: 'brightness(3.4)', offset: 0.22 },
    { transform: 'translate(0,0) scale(0.04) rotate(34deg)',    opacity: 0, filter: 'brightness(1)' },
  ], { duration: 470, easing: 'cubic-bezier(.3,0,.7,1)', fill: 'forwards' });

  a.onfinish = () => {
    a.cancel();
    phoneEl.style.opacity = '0';
    setTimeout(respawn, 200);
  };

  updateHUD();
}

function respawn(){
  state.level++;
  state.maxHp = Math.round(40 * Math.pow(1.45, state.level - 1));
  state.hp = state.maxHp;
  state.cracks.length = 0;
  state.dead = false;
  dmgOverlay.style.opacity = '0';
  phoneEl.style.opacity = '';

  phoneEl.animate([
    { transform: 'translateY(-320px) scale(.85)', opacity: 0 },
    { transform: 'translateY(0) scale(1)',        opacity: 1 },
  ], { duration: 540, easing: 'cubic-bezier(.2,1.35,.5,1)' });

  updateHUD();
  buildShop();
}

/* ================= UI ================= */
function updateHUD(){
  uiShards.textContent = fmt(state.shards);
  uiLevel.textContent  = state.level;
  uiDmg.textContent    = fmt(stats().dmg);

  const pct = clamp(state.hp / state.maxHp, 0, 1);
  hpFill.style.width = (pct * 100) + '%';
  hpText.textContent = fmt(Math.max(0, state.hp)) + ' / ' + fmt(state.maxHp);

  dmgOverlay.style.opacity = String(clamp((1 - pct) * 0.85, 0, 0.85));
}

function upValueText(id){
  const s = stats();
  switch (id){
    case 'click':   return '+' + (1.5).toFixed(1) + ' урона';
    case 'auto':    return '+' + (1.5).toFixed(1) + ' DPS';
    case 'crit':    return '+' + (2) + '% крита';
    case 'critMul': return '+' + (0.5) + 'x крита';
  }
  return '';
}
function upCurrentText(id){
  const s = stats();
  switch (id){
    case 'click':   return 'Урон: ' + fmt(s.dmg);
    case 'auto':    return 'DPS: ' + fmt(s.dps);
    case 'crit':    return 'Крит: ' + Math.round(s.critC * 100) + '%';
    case 'critMul': return 'Множ: x' + s.critM.toFixed(1);
  }
  return '';
}

function buildShop(){
  shopEl.innerHTML = '';
  UPGRADES.forEach(u => {
    const btn = document.createElement('button');
    btn.className = 'upg';
    btn.dataset.id = u.id;
    btn.innerHTML =
      `<div class="upg-top">${u.icon} ${u.name}<span class="upg-lvl" data-lvl></span></div>
       <div class="upg-eff" data-eff></div>
       <div class="upg-cost" data-cost></div>`;
    btn.addEventListener('click', () => buyUpgrade(u));
    shopEl.appendChild(btn);
  });
  refreshShop();
}

function refreshShop(){
  UPGRADES.forEach(u => {
    const btn = shopEl.querySelector(`[data-id="${u.id}"]`);
    if (!btn) return;
    const lvl  = state.up[u.id];
    const cost = upCost(u);
    const maxed = u.maxLvl && lvl >= u.maxLvl;

    btn.querySelector('[data-lvl]').textContent = 'ур.' + lvl;
    btn.querySelector('[data-eff]').textContent = upCurrentText(u.id);
    const costEl = btn.querySelector('[data-cost]');

    if (maxed){
      costEl.textContent = 'МАКС';
      costEl.classList.remove('no');
      btn.disabled = true;
      btn.classList.remove('can');
    } else {
      costEl.textContent = '💎 ' + fmt(cost);
      const can = state.shards >= cost;
      costEl.classList.toggle('no', !can);
      btn.disabled = !can;
      btn.classList.toggle('can', can);
    }
  });
}

function buyUpgrade(u){
  const cost = upCost(u);
  if (u.maxLvl && state.up[u.id] >= u.maxLvl) return;
  if (state.shards < cost) return;

  state.shards -= cost;
  state.up[u.id]++;

  ensureAudio();
  noiseBurst(0.09, 1500, 2.2, 0.16);

  const s = stats();
  // бонус к урону для мгновенного отклика
  if (u.id === 'click') addFloater(
    canvas.clientWidth / 2, canvas.clientHeight * 0.35,
    '👊 УРОН +', '#7ef9ff', 22);

  updateHUD();
  refreshShop();
}

function showToast(text){
  toastEl.textContent = text;
  toastEl.classList.remove('show');
  void toastEl.offsetWidth;
  toastEl.classList.add('show');
}

/* ================= RENDER ================= */
function drawCracks(){
  if (!state.cracks.length) return;
  const r  = phoneEl.getBoundingClientRect();
  const cr = canvas.getBoundingClientRect();
  const ox = r.left - cr.left;
  const oy = r.top  - cr.top;
  if (r.width < 1) return;

  ctx.save();
  ctx.lineCap = 'round';

  // тёмная основа
  ctx.strokeStyle = 'rgba(0,0,0,0.62)';
  for (const c of state.cracks){
    ctx.lineWidth = c.w + 2;
    ctx.beginPath();
    ctx.moveTo(ox + c.x1 * r.width,  oy + c.y1 * r.height);
    ctx.lineTo(ox + c.x2 * r.width,  oy + c.y2 * r.height);
    ctx.stroke();
  }

  // светлая грань
  for (const c of state.cracks){
    ctx.strokeStyle = 'rgba(215,245,255,' + c.a + ')';
    ctx.lineWidth = c.w;
    ctx.beginPath();
    ctx.moveTo(ox + c.x1 * r.width,  oy + c.y1 * r.height);
    ctx.lineTo(ox + c.x2 * r.width,  oy + c.y2 * r.height);
    ctx.stroke();
  }
  ctx.restore();
}

function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.vy += p.grav * dt;
    p.vx *= p.drag;
    p.vy *= p.drag;
    p.x  += p.vx * dt;
    p.y  += p.vy * dt;
    p.rot += p.vr * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floaters.length - 1; i >= 0; i--){
    const f = floaters[i];
    f.y += f.vy * dt;
    f.x += f.vx * dt;
    f.vy *= 0.96;
    f.life -= dt;
    if (f.life <= 0) floaters.splice(i, 1);
  }
}

function drawParticles(){
  for (const p of particles){
    const a = clamp(p.life / 0.6, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;

    if (p.kind === 'shard'){
      ctx.beginPath();
      ctx.moveTo(-p.size, -p.size * 0.45);
      ctx.lineTo(p.size, -p.size * 0.15);
      ctx.lineTo(p.size * 0.3, p.size * 0.7);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, p.size * 0.6, 0, 6.283);
      ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  for (const f of floaters){
    const a = clamp(f.life / f.maxLife, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = `900 ${f.size}px "Segoe UI",system-ui,sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0,0,0,.75)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.shadowColor = f.color;
    ctx.shadowBlur = 16;
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ================= LOOP ================= */
let lastT = performance.now();
let autoAccum = 0;

function loop(now){
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  // авто-урон
  if (!state.dead && state.up.auto > 0){
    const s = stats();
    const dmg = s.dps * dt;
    state.hp -= dmg;
    state.shards += s.dps * dt * 0.35;
    autoAccum += dmg;

    if (autoAccum >= Math.max(1, state.maxHp * 0.02)){
      autoAccum = 0;
      const r = phoneEl.getBoundingClientRect();
      const cr = canvas.getBoundingClientRect();
      if (r.width > 0){
        const x = (r.left - cr.left) + Math.random() * r.width;
        const y = (r.top  - cr.top ) + Math.random() * r.height;
        particles.push({
          x, y, vx: rand(-60,60), vy: rand(-90,-30),
          life: 0.5, maxLife: 1, size: rand(2,5), rot: 0, vr: 0,
          grav: 200, drag: 0.97, kind: 'spark', color: '#ff5ca8',
        });
      }
    }
    if (state.hp <= 0) destroyPhone();
  }

  updateParticles(dt);

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawCracks();
  drawParticles();

  // обновление HUD (числа)
  uiShards.textContent = fmt(state.shards);
  hpFill.style.width = (clamp(state.hp / state.maxHp, 0, 1) * 100) + '%';
  hpText.textContent = fmt(Math.max(0, state.hp)) + ' / ' + fmt(state.maxHp);
  uiDmg.textContent = fmt(stats().dmg);

  requestAnimationFrame(loop);
}

/* ================= RESIZE ================= */
function resize(){
  const w = stage.clientWidth;
  const h = stage.clientHeight;

  let s = Math.min(1, (h - 100) / PHONE_H, (w - 40) / PHONE_W);
  s = Math.max(0.42, s);

  scaler.style.width  = (PHONE_W * s) + 'px';
  scaler.style.height = (PHONE_H * s) + 'px';
  shaker.style.transform = `scale(${s})`;

  const rect = stage.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = Math.round(rect.width  * dpr);
  canvas.height = Math.round(rect.height * dpr);
  canvas.style.width  = rect.width  + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* ================= INPUT ================= */
phoneEl.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  doHit(e.clientX, e.clientY);
}, { passive: false });

// запрет зума двойным тапом
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());

/* ================= GLITCH BARS (декор) ================= */
function makeGlitchBars(){
  for (let i = 0; i < 6; i++){
    const b = document.createElement('div');
    b.className = 'glitch-bar';
    b.style.top = rand(6, 94) + '%';
    b.style.height = rand(1, 5) + 'px';
    b.style.background = Math.random() < 0.5
      ? 'rgba(255,60,140,.65)'
      : 'rgba(80,240,255,.55)';
    b.style.animation = `barSlide ${rand(1.4, 4).toFixed(2)}s infinite steps(1) ${rand(0,2).toFixed(2)}s`;
    screenEl.appendChild(b);
  }
  // кейфрейм для полос
  const st = document.createElement('style');
  st.textContent = `
    @keyframes barSlide{
      0%,100%{transform:translateX(0);opacity:0}
      10%{transform:translateX(-6px);opacity:.9}
      20%{transform:translateX(9px);opacity:.15}
      35%{transform:translateX(-2px);opacity:.8}
      55%{transform:translateX(5px);opacity:0}
      70%{transform:translateX(-8px);opacity:.65}
      85%{transform:translateX(3px);opacity:0}
    }`;
  document.head.appendChild(st);
}

/* ================= INIT ================= */
function init(){
  resize();
  makeGlitchBars();
  buildShop();
  updateHUD();

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  requestAnimationFrame((t) => { lastT = t; loop(t); });

  // периодическое обновление магазина (доступность)
  setInterval(refreshShop, 140);
}

init();

})();
</script>
